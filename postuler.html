<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postuler Activitée</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body id="postulerPage">
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Wakelab</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarNavAltMarkup"
          aria-labelledby="navbarNavAltMarkupLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body">
            <div class="nav nav-pills navbar-nav">
              <a class="nav-link" aria-current="page" href="index.html"
                >Activités</a
              >
              <a class="nav-link active" href="postuler.html">Postuler</a>
            </div>
          </div>
        </dialog>
      </div>
    </nav>

    <main class="container py-5">
      <!-- Page heading -->
      <div class="mb-4">
        <h2 class="fw-bold">Postuler une activitée</h2>
        <p class="text-body-secondary">Remplire le formulaire dessous .</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <div class="card bg-dark text-white border-secondary shadow-sm">
            <div class="card-body p-4 p-md-5">
              <form id="newActivityForm">
                <!-- Activity title -->
                <div class="mb-4">
                  <label for="newActivityTitle" class="form-label fw-semibold">
                    Titre activitée
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="newActivityTitle"
                    name="newActivityTitle"
                    placeholder="Tapez le titre d'activitée..."
                    maxlength="100"
                    required
                  />
                </div>

                <!-- Username -->
                <div class="mb-4">
                  <label
                    for="newActivityUsername"
                    class="form-label fw-semibold"
                  >
                    Nom auteur
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="newActivityAuthor"
                    name="newActivityAuthor"
                    placeholder="Entrez votre nom..."
                    required
                  />
                </div>

                <!-- Theme and duration -->
                <div class="row g-3 mb-4">
                  <div class="col-md-7">
                    <label
                      for="newActivityTheme"
                      class="form-label fw-semibold"
                    >
                      Theme
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="newActivityTheme"
                      name="newActivityTheme"
                      placeholder="e.g. Jeu, Apprentissage..."
                      required
                    />
                  </div>

                  <div class="col-md-5">
                    <label
                      for="newActivityDuration"
                      class="form-label fw-semibold"
                    >
                      Duration (minutes)
                    </label>

                    <input
                      type="number"
                      class="form-control"
                      id="newActivityDuration"
                      name="newActivityDuration"
                      placeholder="e.g. 15"
                      min="1"
                      required
                    />
                  </div>
                </div>

                <hr class="border-secondary my-4" />

                <!-- Objectives -->
                <div class="mb-4">
                  <label
                    for="newActivityObjectives"
                    class="form-label fw-semibold"
                  >
                    Objectives
                  </label>

                  <textarea
                    class="form-control"
                    id="newActivityObjectives"
                    name="newActivityObjectives"
                    rows="3"
                    placeholder="Quels sont les objectives de cette activitée"
                    required
                  ></textarea>

                </div>

                <!-- Description -->
                <div class="mb-4">
                  <label
                    for="newActivityDescription"
                    class="form-label fw-semibold"
                  >
                    Description
                  </label>

                  <textarea
                    class="form-control"
                    id="newActivityDescription"
                    name="newActivityDescription"
                    rows="5"
                    placeholder="Décrire votre activitée en details..."
                    required
                  ></textarea>

                  <div class="form-text">
                    Donnez des instructions et expliquez comment les etudiants
                    participent.
                  </div>
                </div>

                <hr class="border-secondary my-4" />

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2">
                  <button type="reset" class="btn-solid theme-warning">
                    Reset
                  </button>

                  <button type="submit" class="btn-solid theme-success">
                    Confirmer
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
