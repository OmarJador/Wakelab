<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Wakelab</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarNavAltMarkup"
          aria-labelledby="navbarNavAltMarkupLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body">
            <div class="nav nav-pills navbar-nav">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Activités</a
              >
              <a class="nav-link" href="postuler.html">Postuler</a>
            </div>
          </div>
        </dialog>
      </div>
    </nav>

    <main class="container-fluid">
      <div class="row d-flex">
        <!-- Sidebar -->
        <aside
          class="col-12 lg:col-3 border-end p-4 bg-body-tertiary min-vh-100"
        >
          <h5 class="fw-bold mb-4">Rechercher activité</h5>

          <!-- Search -->
          <div class="mb-4">
            <label for="activitySearch" class="form-label"> Rechercher </label>
            <input
              type="search"
              class="form-control"
              id="activitySearch"
              placeholder="Rechercher activité..."
            />
          </div>

          <!-- Category -->
          <div class="mb-4">
            <label for="categoryFilter" class="form-label"> Category :</label>
            <select class="form-select" id="categoryFilter">
              <option value="all" selected>All categories</option>
              <option value="programming">Apprentissage</option>
              <option value="design">Jeu</option>
            </select>
          </div>

          <!-- Refresh -->
          <button
            type="button"
            class="btn btn-outline-secondary w-100"
            id="refreshActivities"
          >
            <span aria-hidden="true">↻</span>
            Refresh
          </button>
        </aside>

        <!-- Main content -->
        <main class="col-12 lg:col-9 p-4">
          <h2>Activités disponibles :</h2>
          <div id="activitiesContainer">
            <!-- Exchange cards will be rendered here -->
          </div>
        </main>
      </div>
    </main>
    <!-- Details modal -->

    <dialog class="dialog dialog-lg" id="activityDialog" data-bs-theme="dark">
      <!-- Header -->
      <div class="dialog-header">
        <div>
          <span
            class="badge bg-warning-subtle text-warning-emphasis mb-2"
            id="modalThemeBadge"
          >
            Jeu
          </span>

          <h5 class="dialog-title" id="activityModalLabel">Activity details</h5>
        </div>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="dialog"
          aria-label="Close"
        ></button>
      </div>

      <!-- Form -->
      <form id="activityForm">
        <!-- Scrollable body -->
        <div class="dialog-body overflow-y-auto" style="max-height: 65vh">
          <!-- Title -->
          <div class="mb-3">
            <label for="modalTitle" class="form-label"> Activity title </label>

            <input
              type="text"
              class="form-control"
              id="modalTitle"
              disabled
              required
            />
          </div>

          <!-- Theme and duration -->
          <div class="row g-3 mb-3">
            <div class="col-md-7">
              <label for="modalTheme" class="form-label"> Theme </label>

              <select class="form-select" id="modalTheme" disabled required>
                <option value="jeu">Jeu</option>
                <option value="apprentissage">Apprentissage</option>
                <option value="creativite">Créativité</option>
                <option value="communication">Communication</option>
              </select>
            </div>

            <div class="col-md-5">
              <label for="modalDuration" class="form-label">
                Duration (minutes)
              </label>

              <input
                type="number"
                class="form-control"
                id="modalDuration"
                min="1"
                disabled
                required
              />
            </div>
          </div>

          <hr class="border-secondary" />

          <!-- Objectives -->
          <div class="mb-3">
            <label for="modalObjectives" class="form-label"> Objectives </label>

            <textarea
              class="form-control"
              id="modalObjectives"
              rows="3"
              disabled
              required
            ></textarea>
          </div>

          <!-- Description -->
          <div class="mb-4">
            <label for="modalDescription" class="form-label">
              Description
            </label>

            <textarea
              class="form-control"
              id="modalDescription"
              rows="5"
              disabled
              required
            ></textarea>
          </div>

          <hr class="border-secondary" />

          <!-- Metadata -->
          <h6 class="fw-semibold mb-3">Activity information</h6>

          <div class="mb-3">
            <label for="modalAuthor" class="form-label"> Author </label>

            <input type="text" class="form-control" id="modalAuthor" disabled />
          </div>

          <div class="mb-2">
            <label for="modalCreatedAt" class="form-label"> Created at </label>

            <input
              type="text"
              class="form-control"
              id="modalCreatedAt"
              disabled
            />
          </div>

          <div class="mb-2">
            <label for="modalUpdatedAt" class="form-label">
              Last updated
            </label>

            <input
              type="text"
              class="form-control"
              id="modalUpdatedAt"
              disabled
            />
          </div>
        </div>

        <!-- Footer -->
        <div class="dialog-footer">
          <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-dismiss="dialog"
          >
            Close
          </button>

          <button
            type="button"
            class="btn btn-outline-warning"
            id="modifyActivityBtn"
          >
            Modify
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            id="cancelEditBtn"
            hidden
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-warning"
            id="saveActivityBtn"
            hidden
          >
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
